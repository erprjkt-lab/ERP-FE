    <!-- Every scroll-reveal/entrance animation (Reveal, AnimatedText, etc.)
         starts at opacity:0 as an inline style and is only ever animated to
         opacity:1 by Framer Motion's JS. Prerendered HTML ships with that
         inline opacity:0 baked in, so with JavaScript disabled or blocked,
         the content never becomes visible — a real user with no-JS, or a
         renderer that gives up before JS runs, sees a blank page below the
         navbar. A stylesheet rule with !important beats an inline style
         without one, and <noscript> content is parsed only when scripting is
         off, so this forces everything visible without touching the normal
         JS-enabled experience at all. -->
    <noscript>
      <style>
        * {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
